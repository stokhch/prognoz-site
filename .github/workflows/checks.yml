# Checks on every push and pull request: shared page parts are up to date, data files and local links are valid,
# unit tests pass. External links are checked weekly (a dead link is a warning, not a failed build).
name: checks
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Header, footer and metadata of the pages are up to date
        run: python3 tools/build_pages.py --check
      - name: Data files, links, page basics
        run: python3 tools/validate_site.py
      - name: Unit tests
        run: node --test tests/*.test.mjs
  external-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --timeout 20 --accept 200,201,204,301,302,403,429 --include-fragments --exclude-path data './*.html'
          fail: false
